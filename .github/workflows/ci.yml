name: Contract CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  direct-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install contract tooling
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q contracts examples tests
      - name: Structural preflight
        run: python scripts/preflight.py
      - name: GenVM lint RecordFuse
        run: genvm-lint check contracts/record_fuse.py
      - name: GenVM lint consumer example
        run: genvm-lint check examples/canonical_record_consumer.py
      - name: Direct Mode tests
        run: pytest tests/direct/ -q
